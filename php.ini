memory_limit = 6G

max_input_vars=15000
upload_max_filesize=1G
post_max_size=1G

log_errors = on
error_log = /var/webserver/log/php/error.log
mail.log = /var/webserver/log/php/mail.log

sendmail_path = /usr/bin/msmtp -t
mail.add_x_header = On

; Preserve the previous image's session storage and Redis lock timing.
session.save_path = /tmp
redis.session.lock_retries = 10
redis.session.lock_wait_time = 2000
